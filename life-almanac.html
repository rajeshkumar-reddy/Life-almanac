<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Almanac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE personal, calm, the same bones as Rajesh's Work Tracker but about a life, not a programme
   IDEA a tree you walk down: section > subsection > group (country, year, topic, stage, place) > item > detail
   PICTURE "This week" page with tiles and highlights; every list is a collapsible tree, collapsed by default
   COLOUR deep slate sidebar, pale page, white cards; one colour per section; to do indigo, waiting violet, overdue red, done green
   TYPE Plus Jakarta Sans throughout
   LAYOUT tree sidebar | page | item details slide in from the right; phones get a Sections drawer */
:root{color-scheme:light dark;--bg:light-dark(#f6f7fa,#111318);--card:light-dark(#fff,#191b23);--ink:light-dark(#1d2030,#e9ebf3);--mute:light-dark(#6a6f84,#9ba0b5);--faint:light-dark(#a2a6b8,#666b80);--line:light-dark(#e7e8ef,#262935);--soft:light-dark(#f1f2f7,#20222c);--nav:#1f2433;--navink:#c9cddd;--navfaint:#7d8399;--act:#5160f0;--todo:#5160f0;--wait:#7d52ee;--late:#e2484d;--done:#259a62;--fitness:#ee5a37;--stamps:#d3263a;--patents:#7d52ee;--learning:#0e8f83;--home:#d89807;--photo:#2a8fd8;--books:#9a5b2c;--money:#1f8a5b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}html{font-size:var(--fs,clamp(14px,calc(8.5px + .42vw),18px))}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.15}
a{color:inherit}button{font-family:inherit}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100%}
#side{background:var(--nav);color:var(--navink);overflow-y:auto;padding:18px 10px 28px;padding-top:max(18px,env(safe-area-inset-top))}
.brand{color:#fff;font-weight:700;font-size:1.15rem;padding:2px 12px}
.store{font-size:.78rem;color:var(--navfaint);display:flex;gap:6px;align-items:center;padding:4px 12px 14px;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.store i{width:7px;height:7px;border-radius:50%;background:var(--navfaint);flex:none}.store.ok i{background:#3ccf8e}.store.warn i{background:#f0b429}
.store:hover{color:#fff}
.nh{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--navfaint);padding:16px 12px 6px}
.ni{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--navink);font-weight:500;min-height:36px;font-size:.93rem}
.ni:hover{background:rgba(255,255,255,.06);color:#fff}
.ni.on{background:var(--act);color:#fff}
.ni em{margin-left:auto;font-style:normal;font-size:.78rem;font-weight:600;color:var(--navfaint);font-variant-numeric:tabular-nums}.ni.on em{color:#e2e5ff}
.ni .d{width:8px;height:8px;border-radius:50%;flex:none}
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:14px;margin-left:12px;border-left:1px solid rgba(255,255,255,.1)}
.tn{display:flex;align-items:center}
.tw{width:22px;height:30px;flex:none;background:none;border:0;color:var(--navfaint);cursor:pointer;display:grid;place-items:center;border-radius:6px;padding:0}
.tw:hover{color:#fff}
.tw svg{transition:transform .15s}.tw.open svg{transform:rotate(90deg)}
.tw.blank{visibility:hidden}
.tn a{flex:1;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--navink);font-size:.9rem;min-height:32px}
.tn a:hover{background:rgba(255,255,255,.06);color:#fff}
.tn a.on{background:var(--act);color:#fff}
.tn a.sec{font-weight:600;color:#fff;font-size:.93rem}
.tn a .d{width:8px;height:8px;border-radius:50%;flex:none}
.tn a em{margin-left:auto;font-style:normal;font-size:.75rem;color:var(--navfaint);font-weight:600}.tn a.on em{color:#e2e5ff}
.addsub{margin:2px 0 6px 36px}
.addsub summary{font-size:.8rem;color:var(--navfaint);cursor:pointer;padding:4px 0;list-style:none}.addsub summary::-webkit-details-marker{display:none}
.addsub form{display:flex;flex-direction:column;gap:6px;padding:4px 6px 8px 0}
.addsub input,.addsub select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
#main{overflow-y:auto;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,40px);padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);z-index:3}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;max-width:620px}
.search input{border:0;background:none;flex:1;min-height:40px;padding:0;outline:0}
.fsz{display:flex;gap:2px}.fsz button{background:none;border:0;color:var(--mute);font-weight:700;padding:6px 8px;border-radius:8px;cursor:pointer}.fsz button:hover{background:var(--soft);color:var(--ink)}
.menubtn{display:none}
.page{padding:6px clamp(16px,2.4vw,44px) 70px;max-width:2300px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:18px;align-items:start;margin-bottom:18px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.col .card{margin:0}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.phgrid>*{aspect-ratio:4/3;border-radius:10px;object-fit:cover;width:100%;background:var(--soft);display:block}
.feed{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}.feed:first-of-type{border-top:0}.feed span{color:var(--faint);min-width:4.5em;white-space:nowrap}
.note{background:color-mix(in srgb,var(--act) 7%,var(--card));border:1px solid color-mix(in srgb,var(--act) 22%,transparent);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:14px}
.crumb{font-size:.82rem;color:var(--act);font-weight:600;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}.crumb span{color:var(--faint)}
.page h1{font-size:clamp(1.6rem,2.5vw,2.1rem);margin-bottom:6px}
.lede{color:var(--mute);margin:0 0 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;display:block}
a.tile:hover{border-color:currentColor}
.tile strong{display:block;font-size:2.1rem;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.tile span{color:var(--mute);font-weight:500;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.card>h2{font-size:1.15rem;margin-bottom:12px}
.card h3{font-size:.95rem;color:var(--act);margin:16px 0 8px}
.card ul{margin:0;padding-left:20px}.card li{margin:6px 0}
.muted{color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;text-decoration:none;display:flex;flex-direction:column;gap:8px;min-height:124px}
.sc:hover{border-color:var(--c)}
.sc .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc .n{font-weight:600;font-size:1rem}
.sc .meta{font-size:.82rem;color:var(--mute);margin-top:auto}
.sc .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:700;font-size:.8rem}
.pbar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c,var(--done));border-radius:3px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--bc) 12%,transparent);color:color-mix(in srgb,var(--bc) 85%,var(--ink))}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bc)}
.gt{border-top:1px solid var(--line)}
.gt:first-child{border-top:0}
.gt>summary{display:flex;align-items:center;gap:10px;padding:12px 4px;cursor:pointer;list-style:none;font-weight:600}
.gt>summary::-webkit-details-marker{display:none}
.gt>summary .cv{width:18px;color:var(--faint);transition:transform .15s;flex:none}
.gt[open]>summary>.cv{transform:rotate(90deg)}
.gt>summary .cnt{margin-left:auto;color:var(--faint);font-weight:500;font-size:.85rem;white-space:nowrap}
.gt>summary:hover{color:var(--act)}
.gt .gb{padding:0 0 8px 22px}
.gt .gt>summary{font-size:.93rem;padding:9px 4px}
.lf{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;border-top:1px solid var(--line)}
.gb>.lf:first-child{border-top:0}
.lf:hover{background:var(--soft)}
.lf.sel{background:color-mix(in srgb,var(--act) 8%,transparent)}
.lf .t{flex:1;line-height:1.35}.lf .t b{font-weight:600}
.lf .t small{display:block;color:var(--faint);font-size:.8rem;margin-top:1px}
.lf .r{color:var(--mute);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.lf .th{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--soft)}
.lf.done .t b{text-decoration:line-through;color:var(--mute)}
.lf a.lk{color:var(--act);text-decoration:none;font-weight:600;font-size:.84rem;white-space:nowrap}
.chk{width:20px;height:20px;border-radius:6px;border:1.8px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0;position:relative;flex:none}
.chk::before{content:"";position:absolute;inset:-10px}
.chk.on{background:var(--done);border-color:var(--done)}
.chk.on::after{content:"";width:8px;height:5px;border:2px solid currentColor;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.mini{height:6px;width:80px;border-radius:3px;background:var(--soft);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}.mini i{display:block;height:100%;background:var(--c,var(--act))}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.tools button{font:inherit;font-size:.82rem;font-weight:600;background:none;border:0;color:var(--act);cursor:pointer;padding:4px 0}
form.add{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
form.add input[type=text],form.add input[type=url]{flex:1 1 14em}
form.add input[type=number],form.add input[type=date],form.add select{flex:0 1 10em}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid color-mix(in srgb,var(--act) 60%,transparent);outline-offset:1px}
.btn{font:inherit;font-weight:600;font-size:.9rem;border:0;border-radius:10px;padding:9px 16px;min-height:40px;background:var(--act);color:#fff;cursor:pointer;white-space:nowrap}
.btn.soft{background:var(--soft);color:var(--ink)}.btn.danger{background:none;color:var(--late);border:1px solid color-mix(in srgb,var(--late) 35%,transparent)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;color:var(--mute);text-align:center;margin:8px 0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.fig{position:relative;height:230px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}.fig.sm{height:170px}
svg text{font:12px "Plus Jakarta Sans",sans-serif;fill:var(--mute);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:140px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:4px;font-size:.78rem;color:var(--mute)}
.bars u{display:block;width:100%;max-width:32px;background:var(--fitness);border-radius:6px 6px 2px 2px}
.hrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:12px;align-items:center;padding:5px 0;font-size:.9rem}
.hrow .track{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}.hrow .track i{display:block;height:100%}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;overflow-x:auto}.heat i{border-radius:3px;background:var(--soft)}
.habits{display:flex;flex-wrap:wrap;gap:8px}
.habit{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;background:var(--card);cursor:pointer;font:inherit;font-weight:500;color:var(--ink)}
.habit.on{background:color-mix(in srgb,var(--done) 12%,var(--card));border-color:color-mix(in srgb,var(--done) 40%,transparent)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--act) 9%,var(--card));border:1px solid color-mix(in srgb,var(--act) 30%,transparent);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.banner p{margin:0;flex:1 1 16em;font-size:.92rem}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--card);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s ease;z-index:20;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
#drawer.open{transform:none;box-shadow:-16px 0 48px rgba(10,14,40,.18)}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,14,40,.25);z-index:19}.scrim.on{display:block}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 0;padding-top:max(18px,env(safe-area-inset-top))}
.x{background:none;border:0;color:var(--mute);font-size:1.4rem;width:36px;height:36px;border-radius:8px;cursor:pointer}.x:hover{background:var(--soft)}
.db{padding:6px 22px 40px}
.dtitle{font:inherit;font-size:1.4rem;font-weight:700;letter-spacing:-.02em;border:0;background:none;padding:6px 0;width:100%;resize:none;overflow:hidden;color:var(--ink);min-height:0}
.dtitle:focus{outline:0;box-shadow:inset 0 -2px 0 var(--act)}
.photo{margin:12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative}
.photo img{display:block;width:100%;max-height:360px;object-fit:contain;background:var(--soft)}
.photo .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:8px;padding:5px 10px;font-size:.78rem;cursor:pointer}
.ph{width:100%;aspect-ratio:16/8;border:1.5px dashed var(--line);border-radius:14px;background:none;color:var(--faint);cursor:pointer;font:inherit;margin:12px 0}.ph:hover{color:var(--ink);border-color:var(--act)}
.field{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.field>span{color:var(--mute);font-size:.85rem}.field input,.field select{width:100%}
.field input[type=range]{accent-color:var(--act);padding:0;border:0;min-height:30px}
.openlink{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:12px;background:var(--act);color:#fff;text-decoration:none;font-weight:600;margin:12px 0}
.openlink small{opacity:.85;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt{display:block;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.opt.on{border-color:var(--act);background:color-mix(in srgb,var(--act) 6%,transparent)}
.opt h3{font-size:1rem;margin-bottom:4px}.opt p{margin:0 0 10px;color:var(--mute);font-size:.88rem}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 10px 9px 16px;border-radius:11px;display:flex;gap:12px;align-items:center;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{background:none;border:1px solid color-mix(in srgb,var(--card) 40%,transparent);color:var(--card);border-radius:7px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer}
@media(max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){body{overflow:auto}.app{display:block;height:auto}#main{height:auto;overflow:visible}#side{position:fixed;inset:0 auto 0 0;width:min(310px,88%);z-index:22;transform:translateX(-102%);transition:transform .22s ease}#side.open{transform:none}.menubtn{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--ink);min-height:40px}.fsz{display:none}.gt .gb{padding-left:10px}}
@media(prefers-reduced-motion:reduce){#drawer,#side,.tw svg,.gt>summary .cv{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside id="side"><div class="brand">Life almanac</div><button class="store" id="store" type="button" data-act="storage"><i></i><span>Starting…</span></button><nav id="nav" aria-label="Sections"></nav></aside>
<main id="main"><div class="top"><button class="menubtn" id="menubtn" type="button">Sections</button><label class="search"><span aria-hidden="true" style="color:var(--faint)">⌕</span><input type="search" id="q" placeholder="Search stamps, links, to-dos…" aria-label="Search"></label><div class="fsz"><button type="button" data-act="fs" data-k="-1" aria-label="Smaller text">A−</button><button type="button" data-act="fs" data-k="1" aria-label="Larger text">A+</button></div></div><div class="page" id="page"></div></main>
</div>
<aside id="drawer" aria-label="Details"></aside><div class="scrim" id="scrim"></div>
<div class="toast" id="toast" hidden><span id="tmsg"></span><button id="undo" type="button">Undo</button></div>
<script>
{
/* ================= config ================= */
const DATA_FILE='tracker-data.json',FOLDER_NAME='Life Almanac';
const AREAS=[
{id:'fitness',n:'Fitness',ic:'Fi',c:'var(--fitness)',subs:[['body','Body and weight'],['workouts','Workouts'],['food','Food']]},
{id:'photo',n:'Photography',ic:'Ph',c:'var(--photo)',subs:[['gear','Gear'],['birding','Birding'],['photos','Photos and shoots'],['skills','Skills to learn'],['wishlist','Wishlist']]},
{id:'stamps',n:'Stamps and coins',ic:'St',c:'var(--stamps)',subs:[['issues2026','India Post 2026'],['stamps','Stamps'],['coins','Coins'],['toget','To get']]},
{id:'patents',n:'Patents and papers',ic:'Pa',c:'var(--patents)',subs:[['pipeline','Pipeline'],['actions','Next steps']]},
{id:'learning',n:'Learning',ic:'Le',c:'var(--learning)',subs:[['reading','Reading list'],['topics','Study topics']]},
{id:'books',n:'Books',ic:'Bo',c:'var(--books)',subs:[['owned','My books'],['want','Want to get']]},
{id:'home',n:'Home and DIY',ic:'Ho',c:'var(--home)',subs:[['projects','Projects'],['errands','Errands']]},
{id:'money',n:'Money and admin',ic:'₹',c:'var(--money)',subs:[['expenses','Expenses'],['subscriptions','Subscriptions'],['bills','Bills'],['warranties','Warranties']]}];
const AC=Object.fromEntries(AREAS.map(a=>[a.id,a]));
const DEFSUB={fitness:'body',photo:'skills',stamps:'toget',patents:'actions',learning:'topics',books:'want',home:'errands',money:'bills'};
const ordr=list=>(x,y)=>{const a=list.indexOf(x),b=list.indexOf(y);return (a<0?99:a)-(b<0?99:b)||String(x).localeCompare(String(y))};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const BANDS=['Upcoming walks','Group walks','Near home (under 15 km)','In the city (under 40 km)','Day trips (under 150 km)','Weekend trips (under 500 km)','Other'];
const BOOKCATS=['Fiction','Non-fiction','Biography and memoir','Science and technology','Business','History','Philosophy','Poetry','Other'];

 if(op.op==='add'&&Array.isArray(arr)){const it={...op.item};if(it.id&&arr.some(x=>x.id===it.id))Object.assign(arr.find(x=>x.id===it.id),it);else{if(!it.id&&op.to!=='fitness.log')it.id=uid();if(op.to==='fitness.log'&&arr.some(x=>x.d===it.d))Object.assign(arr.find(x=>x.d===it.d),it);else arr.push(it)}n++}

}catch(_){}}return n}

function drawW(){const s=$('cw');if(!s)return;const W=s.clientWidth,H=s.clientHeight,F=S.fitness;const L=byDate(F.log.filter(e=>e.w!=null));if(!L.length||!W)return;const ml=38,mr=12,mt=12,mb=24;const ts=L.map(e=>+new Date(e.d));const t0=Math.min(...ts),t1=Math.max(...ts,t0+864e5*7);const ws=L.map(e=>e.w).concat(F.target!=null?[F.target]:[]).concat((F.milestones||[]).map(m=>m.w));const lo=Math.floor(Math.min(...ws)-1),hi=Math.ceil(Math.max(...ws)+1);const X=t=>ml+(t-t0)/(t1-t0)*(W-ml-mr),Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);let g='';const step=Math.max(1,Math.ceil((hi-lo)/4));for(let v=lo;v<=hi;v+=step)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;const nT=W<420?2:4;for(let i=0;i<=nT;i++){const t=t0+(t1-t0)*i/nT;g+=`<text x="${X(t)}" y="${H-4}" text-anchor="${i===0?'start':i===nT?'end':'middle'}">${fmtD(dk(t))}</text>`}(F.milestones||[]).forEach(m=>{if(m.w<lo||m.w>hi||m.w===F.target)return;g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(m.w)}" y2="${Y(m.w)}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 5"/><text x="${ml+6}" y="${Y(m.w)-5}">${m.bf}% · ${m.w} kg</text>`});if(F.target!=null)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(F.target)}" y2="${Y(F.target)}" stroke="var(--done)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${W-mr}" y="${Y(F.target)-6}" text-anchor="end" style="fill:var(--done)">Target ${F.target} kg${F.bfTarget?' at '+F.bfTarget+'% fat':''}</text>`;const av=L.map(e=>{const w=L.filter(f=>new Date(e.d)-new Date(f.d)>=0&&new Date(e.d)-new Date(f.d)<7*864e5);return [X(+new Date(e.d)),Y(w.reduce((a,f)=>a+f.w,0)/w.length)]});g+=L.map(e=>`<circle cx="${X(+new Date(e.d))}" cy="${Y(e.w)}" r="3" fill="var(--fitness)" opacity=".35"/>`).join('')+`<polyline fill="none" stroke="var(--fitness)" stroke-width="2.6" stroke-linejoin="round" points="${av.map(p=>p.join(',')).join(' ')}"/>`;s.innerHTML=g}
function drawC(){const s=$('cc');if(!s)return;const W=s.clientWidth,H=s.clientHeight;const L=byDate(S.fitness.log.filter(e=>e.w!=null&&e.bf!=null)).map(e=>({t:+new Date(e.d),f:e.w*e.bf/100,l:e.w*(1-e.bf/100)}));if(L.length<2||!W)return;const ml=34,mr=44,mt=10,mb=22;const t0=L[0].t,t1=Math.max(L[L.length-1].t,t0+864e5);const vs=L.flatMap(e=>[e.f,e.l]);const lo=Math.floor(Math.min(...vs)-2),hi=Math.ceil(Math.max(...vs)+2);const X=t=>ml+(t-t0)/(t1-t0)*(W-ml-mr),Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);const line=(k,c,n)=>`<polyline fill="none" stroke="${c}" stroke-width="2.6" points="${L.map(e=>X(e.t)+','+Y(e[k])).join(' ')}"/><text x="${X(L[L.length-1].t)+6}" y="${Y(L[L.length-1][k])+4}" style="fill:${c}">${n}</text>`;s.innerHTML=`<text x="${ml-6}" y="${Y(hi)+4}" text-anchor="end">${hi}</text><text x="${ml-6}" y="${Y(lo)+4}" text-anchor="end">${lo}</text><text x="${ml}" y="${H-4}">${fmtD(dk(t0))}</text><text x="${W-mr}" y="${H-4}" text-anchor="end">${fmtD(dk(t1))}</text>`+line('l','var(--todo)','Lean')+line('f','var(--fitness)','Fat')}

 dljson:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=DATA_FILE;a.click()},

 addimg:()=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{const file=f.files[0];if(!file)return;const target={...sel};toast('Saving photo…');try{const name=await B.upload(file);mutate(s=>{const x=s[target.coll].find(y=>y.id===target.id);if(x){x.img=name;x.updated=TODAY}},'Photo added')}catch(_){toast('Couldn’t save that photo')}};f.click()},
 rmimg:()=>mutate(s=>{const x=getItem();if(x)delete x.img},'Photo removed')};

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.lf[data-sel]'))open(e.target.dataset.sel,e.target.dataset.id);if(e.key==='Escape'&&drawer)close()});
$('scrim').onclick=()=>{$('side').classList.remove('open');close()};
document.addEventListener('change',e=>{const t=e.target;const f=t.dataset.f;if(!f||!$('drawer').contains(t)||!sel)return;const target={...sel};
 mutate(s=>{const x=s[target.coll].find(y=>y.id===target.id);if(!x)return;let v=t.value;if(t.type==='range')v=+v;if(t.dataset.bool){x[f]=v==='1';if(x[f])x[f+'On']=TODAY;x.updated=TODAY;return}if(f==='isub'){x.sub=v;x.updated=TODAY;return}if(f==='read'&&target.coll==='reading'){x.read=v==='1';if(x.read)x.readOn=x.readOn||TODAY;else delete x.readOn}else if(f==='owned')x.owned=v==='1';else if(f==='status'){x.status=v;if(v==='done')x.doneOn=TODAY;else delete x.doneOn}else if(f==='area'){x.area=v;delete x.sub}else if(f==='sub'){if(v===DEFSUB[x.area]||!S.subs.some(z=>z.id===v))delete x.sub;else x.sub=v}else if(f==='t'){v=v.trim();if(v)x.t=v}else{if(v==='')delete x[f];else x[f]=v}x.updated=TODAY},'Saved')});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){q=t.value;if(q.trim()){if(location.hash!=='#search')location.hash='search';else render()}else if(location.hash==='#search')location.hash='week'}if(t.classList.contains('dtitle')){t.style.height='auto';t.style.height=t.scrollHeight+'px'}if(t.type==='range'&&t.dataset.f){const b=t.parentElement.querySelector('b');if(b)b.textContent=t.value+'%'}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),T=String(d.t||'').trim();const sub=f.dataset.sub||undefined;const H={
 'f-task':()=>T&&mutate(s=>s.tasks.push({id:uid(),t:T,area:f.dataset.area||d.area||'home',sub,place:String(d.place||'').trim()||undefined,due:d.due||undefined,status:'open',added:TODAY}),'Added'),
 'f-habit':()=>T&&mutate(s=>s.habits.push({id:uid(),t:T,area:d.area}),'Habit added'),
 'f-sub':()=>{const n=String(d.n||'').trim();if(!n)return;const id='s'+uid();mutate(s=>s.subs.push({id,area:f.dataset.area,n,type:d.type}),'Subsection added');location.hash=hashOf(f.dataset.area,id).slice(1)},
 'f-body':()=>{const w=num(d.w),bf=num(d.bf),wa=num(d.waist);if(w==null&&bf==null&&wa==null)return;mutate(s=>{const L=s.fitness.log;const ex=L.find(x=>x.d===d.d);const e2={d:d.d,w:w??ex?.w??null,bf:bf??ex?.bf??null,waist:wa??ex?.waist??null};if(ex)Object.assign(ex,e2);else L.push(e2)},'Logged')},
 'f-wo':()=>{const m=num(d.min);if(!m)return;mutate(s=>s.fitness.workouts.push({id:uid(),d:d.d,kind:String(d.kind||'Workout'),min:m}),'Workout logged')},
 'f-food':()=>{if(num(d.kcal)==null&&num(d.p)==null)return;mutate(s=>s.fitness.food.push({id:uid(),d:TODAY,t:T||'Meal',kcal:num(d.kcal)||0,p:num(d.p)||0}),'Meal logged')},
 'f-tgt':()=>mutate(s=>{s.fitness.target=num(d.target);s.fitness.kcalT=num(d.kcalT);s.fitness.protT=num(d.protT)},'Targets saved'),
 'f-stamp':()=>T&&mutate(s=>s.stamps.push({id:uid(),t:T,kind:f.dataset.coin==='1'?'Coin':d.kind,country:String(d.country||'').trim()||'India',d:d.d||undefined,owned:d.owned==='1',added:TODAY}),'Added'),
 'f-proj':()=>T&&mutate(s=>s.projects.push(f.dataset.area==='patents'?{id:uid(),t:T,area:'patents',kind:d.kind,stage:'Idea'}:{id:uid(),t:T,area:f.dataset.area,sub,progress:0}),'Added'),
 'f-link':()=>{const u=String(d.url||'').trim();if(!u)return;mutate(s=>s.reading.push({id:uid(),t:T||titleFrom(u),url:u,group:String(d.group||'').trim()||'Unsorted',sub,read:false,added:TODAY}),'Link saved')},
 'f-bulk':()=>{const g=String(d.group||'').trim()||'Unsorted';const its=String(d.links||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)\s*\|\s*(https?:\/\/\S+)$/);const u=m?m[2]:(l.match(/https?:\/\/\S+/)||[''])[0];return u?{t:m&&m[1]?m[1]:titleFrom(u),u}:null}).filter(Boolean);if(!its.length)return;mutate(s=>its.forEach(x=>s.reading.push({id:uid(),t:x.t,url:x.u,group:g,sub,read:false,added:TODAY})),its.length+' links saved')},
 'f-topic':()=>T&&mutate(s=>s.topics.push({id:uid(),t:T,p:0}),'Topic added'),
 'f-item':()=>T&&mutate(s=>s.items.push({id:uid(),t:T,area:f.dataset.area,sub:f.dataset.sub,added:TODAY}),'Added')};H[f.id]?.()});
